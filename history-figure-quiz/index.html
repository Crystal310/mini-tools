}

.seal-corner{

}

.masthead{

}

}
.masthead p{

}

.card{

}

.btn-primary{

const QUESTIONS = [

const VALUE_ORDER = [1,2,4,5];

function computeResult(answerIdx){
  const sums = [0,0,0,0,0,0];
  const counts = [0,0,0,0,0,0];
  answerIdx.forEach((idx, qi) => {
    const q = QUESTIONS[qi];
    sums[q.axis] += q.options[idx].v;
    counts[q.axis]++;
  });
  const userVec = sums.map((s,i) => s / counts[i]);

  let best = null, bestDist = Infinity;
  FIGURES.forEach(f => {
    let d = 0;
    for(let i=0;i<6;i++){ d += (userVec[i]-f.vec[i])**2; }
    d = Math.sqrt(d);
    if(d < bestDist){ bestDist = d; best = f; }
  });
  const maxDist = Math.sqrt(6*16);
  let pct = Math.round((1 - bestDist/maxDist) * 100);
  pct = Math.max(58, Math.min(99, pct));
  return {figure:best, userVec, pct};
}

function encodeAnswers(answerIdx){
  return answerIdx.join("");
}
function decodeAnswers(str){
  if(!/^[0-3]{12}$/.test(str)) return null;
  return str.split("").map(Number);
}

const viewQuiz = document.getElementById("view-quiz");
const viewResult = document.getElementById("view-result");
const figureStrip = document.getElementById("figure-strip");
const sharedNote = document.getElementById("shared-note");

FIGURES.forEach(f => {
  const chip = document.createElement("span");
  chip.className = "figure-chip";
  chip.textContent = f.name;
  figureStrip.appendChild(chip);
});

let current = 0;
let answers = [];

function showView(v){
  viewIntro.hidden = v !== "intro";
  viewQuiz.hidden = v !== "quiz";
  viewResult.hidden = v !== "result";
}

function renderQuestion(){
  const q = QUESTIONS[current];
  document.getElementById("progress-label").textContent = `问 ${current+1} / ${QUESTIONS.length}`;
  document.getElementById("progress-axis").textContent = AXES[q.axis];
  document.getElementById("progress-fill").style.width = `${(current/QUESTIONS.length)*100}%`;

  const wrap = document.getElementById("q-wrap");
  wrap.innerHTML = "";
  wrap.classList.remove("q-wrap");
  void wrap.offsetWidth;
  wrap.classList.add("q-wrap");

  const qText = document.createElement("p");
  qText.className = "q-text";
  qText.textContent = q.text;
  wrap.appendChild(qText);

  const opts = document.createElement("div");
  opts.className = "options";
  q.options.forEach((opt, i) => {
    const b = document.createElement("button");
    b.className = "option";
    b.textContent = opt.t;
    b.addEventListener("click", () => selectAnswer(i));
    opts.appendChild(b);
  });
  wrap.appendChild(opts);
}

function selectAnswer(i){
  answers[current] = i;
  current++;
  if(current < QUESTIONS.length){
    renderQuestion();
  } else {
    document.getElementById("progress-fill").style.width = "100%";
    setTimeout(() => renderResult(answers), 180);
  }
}

function renderResult(answerIdx){
  const {figure, userVec, pct} = computeResult(answerIdx);
  const code = encodeAnswers(answerIdx);

  document.getElementById("r-name").textContent = figure.name;
  document.getElementById("r-name-legend").textContent = figure.name;
  document.getElementById("r-title").textContent = figure.title;
  document.getElementById("r-quote").textContent = figure.quote;
  document.getElementById("r-desc").textContent = figure.desc;
  document.getElementById("r-pct").textContent = `${pct}%`;
  document.getElementById("r-ring").style.setProperty("--pct", pct);

  const axesWrap = document.getElementById("r-axes");
  axesWrap.innerHTML = "";
  AXES.forEach((name, i) => {
    const row = document.createElement("div");
    row.className = "axis-row";
    const label = document.createElement("span");
    label.className = "axis-name";
    label.textContent = name;
    const track = document.createElement("div");
    track.className = "axis-track";
    const you = document.createElement("div");
    you.className = "axis-you";
    you.style.left = `${(userVec[i]/5)*100}%`;
    const fig = document.createElement("div");
    fig.className = "axis-figure";
    fig.style.left = `${(figure.vec[i]/5)*100}%`;
    track.appendChild(fig);
    track.appendChild(you);
    row.appendChild(label);
    row.appendChild(track);
    axesWrap.appendChild(row);
  });

  const url = new URL(location.href);
  url.searchParams.set("a", code);
  document.getElementById("btn-share").onclick = () => {
    navigator.clipboard.writeText(url.toString()).then(() => showToast("链接已复制，快分享给朋友吧"))
      .catch(() => showToast("复制失败，请手动复制地址栏链接"));
  };

  showView("result");
}

function showToast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(showToast._timer);
  showToast._timer = setTimeout(() => t.classList.remove("show"), 2200);
}

document.getElementById("btn-start").addEventListener("click", () => {
  current = 0; answers = [];
  renderQuestion();
  showView("quiz");
});
document.getElementById("btn-retry").addEventListener("click", () => {
  const url = new URL(location.href);
  url.searchParams.delete("a");
  history.replaceState(null, "", url.toString());
  sharedNote.hidden = true;
  current = 0; answers = [];
  renderQuestion();
  showView("quiz");
});

(function init(){
  const params = new URL(location.href).searchParams;
  const shared = params.get("a");
  const decoded = shared ? decodeAnswers(shared) : null;
  if(decoded){
    sharedNote.hidden = false;
    renderResult(decoded);
  } else {
    showView("intro");
  }
})();
</script>
